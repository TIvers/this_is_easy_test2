<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Adrobot{% endblock %}</title>
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --line:#dfe4ec; --text:#1d2735; --muted:#697586; --accent:#315de8; --danger:#bf3434; --ok:#1d8050; }
    * { box-sizing:border-box; }
    body { margin:0; font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--text); }
    header { background:#fff; border-bottom:1px solid var(--line); padding:14px max(20px,calc((100% - 1120px)/2)); }
    header a { color:var(--text); font-weight:700; font-size:17px; text-decoration:none; }
    main { max-width:1120px; margin:28px auto; padding:0 18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:18px; box-shadow:0 2px 8px #1e293b08; }
    h1 { margin:0 0 16px; font-size:21px; } h2 { margin:0 0 14px; font-size:17px; }
    label { display:block; margin:10px 0 5px; color:var(--muted); font-size:12px; }
    input,select { width:100%; min-height:38px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; background:white; font:inherit; }
    .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:14px; }
    button { padding:8px 13px; border:1px solid var(--line); border-radius:6px; background:#fff; font:inherit; cursor:pointer; }
    button:hover { border-color:#aab5c5; } button:disabled { opacity:.55; cursor:wait; }
    button.primary { color:#fff; border-color:var(--accent); background:var(--accent); }
    button.danger { color:var(--danger); }
    table { width:100%; border-collapse:collapse; }
    th,td { padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
    th { color:var(--muted); font-size:12px; white-space:nowrap; }
    td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
    .muted { color:var(--muted); } .msg { margin-top:12px; } .err { color:var(--danger); } .ok { color:var(--ok); }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; }
    .toolbar h1 { margin:0; } .toolbar label { display:inline; margin:0 8px 0 0; }
    a { color:var(--accent); } .total-ok { color:var(--ok); } .total-bad { color:var(--danger); }
    .table-wrap { overflow-x:auto; }
    .pending-change { background:#fff3bf !important; }
    .pending-stream { border-color:#d5a500; }
    .removed-offer td:not(:last-child) { color:var(--muted); text-decoration:line-through; }
    .change-banner { padding:10px 12px; border:1px solid #e6c75a; border-radius:7px; background:#fff3bf; }
    @media(max-width:600px) { main { margin:16px auto; padding:0 10px; } .card { padding:15px; } }
  </style>
</head>
<body>
  <header><a href="/">Adrobot</a></header>
  <main>{% block content %}{% endblock %}</main>
  <script>
    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(method, url, body) {
      const response = await fetch(url, {
        method,
        headers: body ? {'Content-Type':'application/json'} : {},
        body: body ? JSON.stringify(body) : undefined
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        const detail = data.detail;
        throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail) || response.statusText);
      }
      return data;
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
